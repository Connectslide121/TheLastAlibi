name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # The Cloudflare Worker deploys separately (worker/, `npm run deploy`).
    paths-ignore:
      - 'worker/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /TheLastAlibi/
      # GitHub Pages serves 404.html for unknown paths, which lets deep links
      # (e.g. /TheLastAlibi/investigation) boot the app and route client-side.
      - run: cp dist/TheLastAlibi/browser/index.html dist/TheLastAlibi/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/TheLastAlibi/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
